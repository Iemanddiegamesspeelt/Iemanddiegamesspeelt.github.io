<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a0f" />
    <title>MacroHub</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #080a0f; color: #f8fafc; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 0, rgba(124,92,255,.18), transparent 35rem), #080a0f; }
      main { width: min(36rem, calc(100% - 2rem)); text-align: center; }
      .mark { display: grid; width: 3.5rem; height: 3.5rem; margin: auto; place-items: center; border-radius: 1.2rem; background: linear-gradient(135deg, #8b5cf6, #4f46e5); box-shadow: 0 0 3rem rgba(124,92,255,.35); }
      .mark::after { content: ''; width: 1rem; height: 1rem; border: 2px solid white; border-radius: .3rem; }
      h1 { margin: 1.5rem 0 .75rem; font-size: clamp(2.5rem, 10vw, 4.5rem); letter-spacing: -.06em; }
      span { color: #a78bfa; }
      p { margin: 0 auto; max-width: 30rem; color: #71717a; line-height: 1.7; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Macro<span>Hub</span></h1>
      <p>The new MacroHub deployment is being connected.</p>
    </main>
  </body>
</html>
